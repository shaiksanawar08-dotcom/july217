<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of css Selectors Example</title>
    <style>
        *{
            background-color: rgb(241, 179, 157);
        }
        h2{
            background-color: blueviolet;
            color: azure;
           font-family: Arial, sans-serif;
        }
        a[href=]{
            color: rgb(255, 0, 0);
            background-color: blue;
            text-decoration: none;
        }
    #main{
        background-color: crimson;
        color: darkmagenta;
        font-family:'gill sans', sans-serif;
        text-align: left;
    }
    .child{
        font-weight: bold;
        color: darkblue;
        font-family:monospace;
        background-color: beige;
    }
    p{
        background-color: rgb(255, 0, 0);
        color:blanchedalmond
    }
    .para1{
        background-color: rgb(200, 0, 255);
        color: rgb(0, 0, 0);
    }
    .para2{
        background-color: rgb(230, 0, 255);
        color: rgb(0, 0, 0);
    }
    </style>
</head>
<body>
    <h1> types of selectors in css</h1>
    <h2>1.Element selectors</h2>
    <p class="child">Element name is used to apply the styling.</p>
    <h2 id= "main">2.ID selectors</h2>
    <p id="para1" class="para2">We create ID names in the tag, to applay styling we use #idname.</p>
    <a href="#">Youtube channel</a>
    <h2 class="child">3.Class selectors</h2>
</body>
</html>
