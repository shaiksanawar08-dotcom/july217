<!DOCTYPE html>
<html lang="en">
    <head> 
    <meta charset="UTF-8">
    <title>2D grid layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: garamond;
            padding: 20px;
            background-color:rgb(206, 152, 86);
        }
        .grid-container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
        }
        .item{
            background-color: rgb(90, 51, 7);
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
           border-radius: 8px;
        }
        .item1{
            grid-column: 1 / 3;
            grid-row: 1 / 2;
        }
        .item2{
            grid-column: 3 / 4;
            grid-row: 1 / 3;
        }
        .item3{
            grid-column: 1 / 2;
            grid-row: 2 / 2;
        }
        .item4{
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }
        .item5{
            grid-column: 2 / 4;
            grid-row: 3 / 4;
        }
        .item6{
            grid-column: 1 / 2;
            grid-row: 3 / 4;
        }
    </style>
    </head>
    <body>
        <div class="grid-container">
            <div class="item item1">Bags</div>
            <div class="item item2">Bottles</div>
            <div class="item item3">Glasses</div>
            <div class="item item4">Wapers</div>
            <div class="item item5">Kettles</div>
            <div class="item item6">Shoes</div>
        </div>
    </body>
</html>
